name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: api
        run: ruff check .

      - name: Pruebas
        working-directory: api
        run: pytest -q

  web:
    name: Web · tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Verificar tipos
        working-directory: web
        run: npx tsc --noEmit

      - name: Compilar
        working-directory: web
        run: npm run build

  images:
    name: Imagenes Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Construir sin publicar: comprueba que el Dockerfile realmente
      # funciona, que es la mitad de los "funciona en mi maquina".
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
